              M0,50 Q200,72 400,50 T800,50 L800,140 L0,140 Z;
              M0,50 Q200,28 400,50 T800,50 L800,140 L0,140 Z"/>
  </path>

  <!-- موج جلویی (اصلی) -->
  <path fill="url(#wg)" opacity="0.9" d="M0,66 Q200,88 400,66 T800,66 L800,140 L0,140 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0,66 Q200,88 400,66 T800,66 L800,140 L0,140 Z;
              M0,66 Q200,44 400,66 T800,66 L800,140 L0,140 Z;
              M0,66 Q200,88 400,66 T800,66 L800,140 L0,140 Z"/>
